<script language="JScript">
var root='D:\\ProcessCenter\\StackChan\\fusion.firmware.0731\\gateway';var statusPath=root+'\\state\\tray_status.json';
function readText(path){try{var f=new ActiveXObject('Scripting.FileSystemObject');if(!f.FileExists(path))return '';var stream=new ActiveXObject('ADODB.Stream');stream.Type=2;stream.Charset='utf-8';stream.Open();stream.LoadFromFile(path);var s=stream.ReadText();stream.Close();return s;}catch(e){return '';}}
function state(){try{return JSON.parse(readText(statusPath));}catch(e){return {};}}
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function set(id,v){var e=document.getElementById(id);if(e)e.innerHTML=v;}
function timeText(v){if(!v)return '—';var m=String(v).match(/(\d{2}:\d{2}:\d{2})/);return m?m[1]:String(v);}
function refresh(){var s=state(),online=!!(s.robotOnline||s.robotPresence==='online'),text=s.lastBroadcast||s.currentText||s.lastPush||'暂无播报',pending=s.pending||s.total||0,stamp=timeText(s.lastBroadcastTs),latency=s.avgLatency||'n/a';if(latency==='待采样')latency='n/a';set('onlineText',(online?'在线 · 待机':'机器人离线'));set('petState',(online?'● 在线 · 待机':'● 机器人离线'));set('queueCount','待播报  '+esc(pending)+' 条');set('caption',esc(text));set('current',esc(text));set('recent',esc(s.lastBroadcast||'暂无已播报记录'));set('currentTime',esc(stamp));set('recentTime',esc(stamp));set('pendingValue',esc(pending));set('todayValue',esc(s.broadcastToday||s.todayBroadcasts||0));set('successValue',esc(s.broadcastSuccessRate||s.successRate||'—'));set('latencyValue',esc(latency));set('gatewayText',(s.gatewayOk||s.gwOk?'在线':'离线'));set('mqttText',(s.mqttOk||s.robotOk?'已连接':'离线'));set('hooksText',(s.hookFault?'有告警':'正常'));}
function runPs(file,args,visible){try{new ActiveXObject('WScript.Shell').Run('powershell.exe -NoProfile -ExecutionPolicy Bypass '+(visible?'':'-WindowStyle Hidden ')+'-File "'+root+'\\'+file+'" '+(args||''),visible?1:0,false);}catch(e){alert('无法启动操作：'+e.message);}}
function runPwsh(file,args){try{new ActiveXObject('WScript.Shell').Run('pwsh.exe -NoProfile -WindowStyle Hidden -File "'+root+'\\'+file+'" '+(args||''),0,false);}catch(e){alert('无法启动操作：'+e.message);}}
function runPy(file,args){try{new ActiveXObject('WScript.Shell').Run('C:\\WINDOWS\\py.exe -3 "'+root+'\\'+file+'" '+(args||''),0,false);}catch(e){alert('无法启动操作：'+e.message);}}
var pinned=false;function setPin(v){try{var code=new ActiveXObject('WScript.Shell').Run('powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "'+root+'\\widget_topmost.ps1" -Mode '+(v?'on':'off'),0,true);if(code!==0){alert('置顶操作未完成，请重试。');return;}pinned=!!v;var b=document.getElementById('pin');b.className=pinned?'toggle':'toggle off';b.title=pinned?'窗口始终置顶：开':'窗口始终置顶：关';}catch(e){alert('置顶操作失败：'+e.message);}}function togglePin(){setPin(!pinned);}function openQueue(){runPwsh('fusion_tray.ps1','-ShowQueue');}function openSettings(){try{new ActiveXObject('WScript.Shell').Run('notepad.exe "'+root+'\\config.json"',1,false);}catch(e){alert('无法打开配置：'+e.message);}}function refreshNow(){refresh();}
function fit(){var w=document.documentElement.clientWidth||document.body.clientWidth||1536,h=document.documentElement.clientHeight||document.body.clientHeight||1024,hostScale=1,s=Math.min((w-8)/(1536*hostScale),(h-8)/(1024*hostScale));if(s>0){document.getElementById('ui').style.transform='scale('+s+')';}}
function lockSize(){try{window.resizeTo(1220,870);new ActiveXObject('WScript.Shell').Run('powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "'+root+'\\widget_topmost.ps1" -Width 976 -Height 696',0,false);}catch(e){}fit();}
window.onload=function(){lockSize();refresh();setPin(false);window.setInterval(refresh,2000);};window.onblur=function(){if(pinned)window.setTimeout(function(){setPin(true);},50);};window.onresize=function(){window.setTimeout(lockSize,80);};
</script>
